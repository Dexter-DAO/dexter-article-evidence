[workspace]
members = ["crates/contracts", "programs/principal-registry", "programs/claims-core", "programs/pool-issuer"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["solana-v3", "token", "associated_token"] }
solana-sha256-hasher = "=3.1.0"
dexter-contracts = { path = "crates/contracts" }
principal-registry = { path = "programs/principal-registry", features = ["cpi"] }
pool-issuer = { path = "programs/pool-issuer", features = ["cpi"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
